<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen3.8-27B · two-Mac chat</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --fg:#e6e6e6; --dim:#8a919e; --acc:#5aa9ff; --me:#1f3a5f; --bot:#20242c; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100vh; }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid #262b35; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0 8px 0 0; }
  header label { color:var(--dim); font-size:13px; display:flex; align-items:center; gap:4px; }
  #status { margin-left:auto; color:var(--dim); font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:860px; padding:10px 14px; border-radius:10px; white-space:pre-wrap; word-wrap:break-word; }
  .user { background:var(--me); align-self:flex-end; }
  .assistant { background:var(--bot); align-self:flex-start; }
  .meta { color:var(--dim); font-size:12px; margin-top:6px; }
  .err { color:#ff8080; }
  footer { display:flex; gap:8px; padding:12px 16px; background:var(--panel); border-top:1px solid #262b35; }
  textarea { flex:1; resize:none; height:64px; background:#0c0e12; color:var(--fg); border:1px solid #2c3240; border-radius:8px; padding:8px; font:inherit; }
  button { background:#2a3140; color:var(--fg); border:1px solid #3a4356; border-radius:8px; padding:0 14px; font:inherit; cursor:pointer; }
  button.primary { background:var(--acc); color:#06121f; border-color:var(--acc); }
  button:disabled { opacity:.45; cursor:default; }
  #mic.on { background:#c0392b; border-color:#c0392b; }
  input[type=number] { width:64px; background:#0c0e12; color:var(--fg); border:1px solid #2c3240; border-radius:6px; }
</style>
</head>
<body>
<header>
  <h1>Qwen3.8-27B · M2 Pro + M4 mini</h1>
  <label><input type="checkbox" id="think"> thinking</label>
  <label>temp <input type="number" id="temp" min="0" max="2" step="0.1" value="0"></label>
  <label>max <input type="number" id="maxtok" min="1" max="6144" step="16" value="4096"></label>
  <label><input type="checkbox" id="speak"> read replies aloud</label>
  <button id="newchat">New chat</button>
  <span id="status">connecting…</span>
</header>
<div id="log"></div>
<footer>
  <button id="mic" title="Hold to dictate (or hold Ctrl+Space)">🎤 Hold</button>
  <textarea id="input" placeholder="Type or hold the mic to dictate. Enter = send, Shift+Enter = newline."></textarea>
  <button id="send" class="primary">Send</button>
  <button id="stop" disabled>Stop</button>
</footer>
<script>
const $ = id => document.getElementById(id);
let history = [];
let controller = null;

async function health() {
  try {
    const h = await (await fetch('/health')).json();
    $('status').textContent = h.ready ? `ready · ${h.mode}${h.adaptive_tau!=null?' τ'+h.adaptive_tau:''} · ctx ${h.context_tokens} · ${h.busy?'busy':'idle'}` : 'loading…';
  } catch { $('status').textContent = 'server unreachable'; }
}
setInterval(health, 3000); health();

function bubble(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
  return d;
}

async function send() {
  const text = $('input').value.trim();
  if (!text || controller) return;
  $('input').value = '';
  history.push({role:'user', content:text});
  bubble('user', text);
  const out = bubble('assistant', '');
  const meta = document.createElement('div'); meta.className = 'meta';
  controller = new AbortController();
  $('send').disabled = true; $('stop').disabled = false;
  let reply = '', stats = null, errMsg = null, t0 = performance.now(), tFirst = null, nChunks = 0;
  try {
    const r = await fetch('/v1/chat/completions', {
      method:'POST', headers:{'Content-Type':'application/json'}, signal: controller.signal,
      body: JSON.stringify({messages: history, stream: true, enable_thinking: $('think').checked,
                            temperature: parseFloat($('temp').value)||0, max_tokens: Math.min(6144, parseInt($('maxtok').value)||4096)})
    });
    if (!r.ok) { const e = await r.json().catch(()=>({error:r.statusText})); throw new Error(e.message || e.error); }
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i+2);
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6); if (data === '[DONE]') continue;
        const j = JSON.parse(data);
        if (j.error) throw new Error(j.error);
        const delta = j.choices?.[0]?.delta?.content;
        if (delta) { if (tFirst===null) tFirst = performance.now(); reply += delta; nChunks++; out.textContent = reply; $('log').scrollTop = $('log').scrollHeight;
          meta.textContent = `streaming… ${((performance.now()-t0)/1000).toFixed(1)} s`; out.appendChild(meta); }
        if (j.x_stats) stats = j.x_stats;
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') errMsg = e.message;
  } finally {
    if (controller && controller.signal.aborted) fetch('/v1/cancel', {method:'POST'});
    controller = null; $('send').disabled = false; $('stop').disabled = true;
  }
  out.textContent = reply;
  if (stats) {
    meta.textContent = `${stats.usage.completion_tokens} tok · ${stats.post_first_tokens_per_second ? stats.post_first_tokens_per_second.toFixed(1) : '–'} tok/s decode · ${stats.wall_tokens_per_second.toFixed(1)} tok/s overall · first token ${stats.first_token_seconds.toFixed(2)} s · prompt ${stats.usage.prompt_tokens} · ${stats.finish_reason}`;
  } else meta.textContent = errMsg ? ('Error: ' + errMsg) : 'stopped';
  out.appendChild(meta);
  if (reply) history.push({role:'assistant', content:reply}); else history.pop();
  if ($('speak').checked && reply && 'speechSynthesis' in window) {
    speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(reply));
  }
}

$('send').onclick = send;
$('stop').onclick = () => { fetch('/v1/cancel', {method:'POST'}); if (controller) controller.abort(); speechSynthesis?.cancel(); };
$('newchat').onclick = () => { if (controller) return; history = []; $('log').innerHTML = ''; speechSynthesis?.cancel(); };
$('input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

// Push-to-talk dictation via Web Speech API (browser-provided; may use the browser vendor's speech service).
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, base = '', listening = false;
if (!SR) { $('mic').disabled = true; $('mic').title = 'SpeechRecognition not supported in this browser'; }
function micStart() {
  if (!SR || listening) return;
  rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = navigator.language || 'en-US';
  base = $('input').value ? $('input').value.replace(/\s*$/, ' ') : '';
  rec.onresult = ev => { let t = ''; for (let i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript; $('input').value = base + t; };
  rec.onerror = ev => { $('status').textContent = 'mic: ' + ev.error; };
  rec.onend = () => { listening = false; $('mic').classList.remove('on'); };
  speechSynthesis?.cancel();
  rec.start(); listening = true; $('mic').classList.add('on');
}
function micStop() { if (rec && listening) rec.stop(); }
$('mic').addEventListener('pointerdown', e => { e.preventDefault(); micStart(); });
['pointerup','pointerleave','pointercancel'].forEach(ev => $('mic').addEventListener(ev, micStop));
document.addEventListener('keydown', e => { if (e.ctrlKey && e.code === 'Space' && !e.repeat) { e.preventDefault(); micStart(); } });
document.addEventListener('keyup', e => { if (e.code === 'Space' || e.key === 'Control') micStop(); });
</script>
</body>
</html>
