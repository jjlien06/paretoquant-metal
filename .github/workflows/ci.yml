name: CPU correctness and packaging

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU package and development tools
        run: python -m pip install '.[dev]' build
      - name: CPU tests; Metal and local-checkpoint tests skip explicitly
        run: python -m pytest -q
      - name: Lint package, tests and supported scripts
        run: python -m ruff check src tests scripts
      - name: Build distribution
        run: python -m build
